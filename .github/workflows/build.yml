name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Serve per creare/aggiornare la Release dal workflow (token GitHub Actions).
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Il pacchetto legacy "tools" (default dell'action) non esiste piu'
          # nel repo SDK e faceva fallire lo step. platform/build-tools sono
          # gia' presenti sul runner (o scaricati da AGP).
          packages: 'platform-tools'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK (nome con versione)
        run: |
          mkdir -p dist
          VERSION=$(grep -E 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/HomeboxDroid-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/HomeboxDroid-debug-${GITHUB_SHA::7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeboxDroid-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      # Su push di main pubblica/aggiorna una Release "rolling" con l'APK, usando
      # il token di Actions (indipendente dai permessi di push dell'utente).
      - name: Publish/update rolling Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: HomeboxDroid - ultima build (main)
          body: |
            APK di test compilato automaticamente dall'ultimo commit su main.
            Commit: ${{ github.sha }}
          files: dist/HomeboxDroid-v*-debug.apk
          fail_on_unmatched_files: true
          make_latest: true

  # Release versionata quando si pusha un tag vX.Y.Z (opzionale, per il futuro).
  release:
    name: Publish APK on tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/HomeboxDroid-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
